packages:
  - docs
  - __tests__/*

autoInstallPeers: false

onlyBuiltDependencies:
  - esbuild
  - playwright-chromium
  - simple-git-hooks

overrides:
  ora>string-width: ^5
  vite: 'catalog:'
  vitest: 'catalog:'

patchedDependencies:
  '@types/markdown-it-attrs': patches/@types__markdown-it-attrs.patch
  '@types/mdurl@2.0.0': patches/@types__mdurl@2.0.0.patch
  markdown-it-anchor@9.2.0: patches/markdown-it-anchor@9.2.0.patch
  markdown-it-attrs@4.3.1: patches/markdown-it-attrs@4.3.1.patch

shellEmulator: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  '@voidzero-dev/vite-plus': latest
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
